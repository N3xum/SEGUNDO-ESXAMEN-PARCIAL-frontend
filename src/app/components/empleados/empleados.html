<div class="container my-5">
    <h2 class="text-center mb-4">Sistema de Empleados</h2>

    <!-- FORMULARIO -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Agregar Nuevo Empleado</h5>
        </div>
        <div class="card-body">
            
            <div *ngIf="mensaje" class="alert alert-success">{{mensaje}}</div>
            <div *ngIf="error" class="alert alert-danger">{{error}}</div>

            <form (ngSubmit)="agregarEmpleado()">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Nombre *</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            [(ngModel)]="nuevoEmpleado.nombre"
                            name="nombre"
                            required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Apellido *</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            [(ngModel)]="nuevoEmpleado.apellido"
                            name="apellido"
                            required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Correo *</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            [(ngModel)]="nuevoEmpleado.correo"
                            name="correo"
                            required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Salario *</label>
                        <input 
                            type="number" 
                            class="form-control" 
                            [(ngModel)]="nuevoEmpleado.salario"
                            name="salario"
                            step="0.01"
                            min="0"
                            required>
                    </div>
                    <div class="col-md-1 mb-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Agregar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- TABLA DE EMPLEADOS -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Lista de Empleados</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Salario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let emp of empleados">
                        <td>{{emp.id}}</td>
                        <td>{{emp.nombre}}</td>
                        <td>{{emp.apellido}}</td>
                        <td>{{emp.correo}}</td>
                        <td>${{emp.salario}}</td>
                    </tr>
                </tbody>
            </table>
            
            <div *ngIf="empleados.length === 0" class="text-center text-muted">
                No hay empleados registrados
            </div>
        </div>
    </div>
</div>
